<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tonton video yang dibagikan di Aceimq.">
  <title>Video — Aceimq</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#182230;background:#f6f7f9}
    *{box-sizing:border-box}body{margin:0}.topbar{height:70px;background:#fff;border-bottom:1px solid #e7e9ee;display:flex;align-items:center;padding:0 clamp(18px,4vw,56px)}
    .brand{font-size:27px;font-weight:850;letter-spacing:-1.3px;color:#111827;text-decoration:none}.brand span{color:#2563eb}
    .wrap{max-width:1000px;margin:0 auto;padding:0}.panel{background:transparent;border:0;border-radius:0;padding:0;box-shadow:none}
    h1{display:none}.video{display:block;width:100%;height:auto;max-height:100vh;background:#000;border-radius:0}
    .hint{display:none}.affiliate{display:none}
    .affiliate h2{font-size:19px;margin:0 0 8px}.affiliate p{font-size:14px;color:#667085;line-height:1.5}
    .button{display:inline-flex;align-items:center;justify-content:center;background:#202938;color:#fff;text-decoration:none;border-radius:999px;padding:12px 20px;font-weight:700}.button:hover{background:#344054}
    .error{display:none;color:#b42318;background:#fef3f2;border:1px solid #fecdca;border-radius:12px;padding:12px;font-size:14px;line-height:1.5;white-space:pre-wrap}
    .footer{display:none}
    @media(max-width:560px){.wrap{margin:22px auto}.topbar{height:64px}.brand{font-size:24px}}
  </style>
</head>
<body>
  
  <main class="wrap">
    <section class="panel">
      <h1 id="videoTitle">Memuat video…</h1>
      <video class="video" id="videoPlayer" controls playsinline preload="metadata"></video>
      <p class="hint" id="videoHint">Mengambil data video dari server…</p>
      <section class="affiliate" id="affiliateCard">
        <h2 id="affiliateTitle">Link afiliasi</h2>
        <p id="affiliateDescription"></p>
        <p>Ini adalah tautan afiliasi. Kami mungkin menerima komisi tanpa biaya tambahan untuk kamu.</p>
        <a class="button" id="affiliateLink" href="#" target="_blank" rel="sponsored noopener noreferrer">Buka link afiliasi</a>
      </section>
      <div class="error" id="error" role="alert"></div>
    </section>
    <div class="footer">Aceimq · Bagikan hanya video yang kamu miliki atau berhak bagikan.</div>
  </main>
  <script src="/video.js" defer></script>
</body>
</html>
